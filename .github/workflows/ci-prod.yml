name: CI - Production

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linters
        run: npm install -g htmlhint stylelint stylelint-config-standard

      - name: Configure Stylelint
        run: echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json

      - name: Run HTML Hint
        run: htmlhint src/**/*.html

      - name: Run Stylelint
        run: stylelint src/**/*.css

  build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Docker Build Run
        run: docker build -t prod-website-image .