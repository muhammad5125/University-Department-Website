name: CI - Development

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - 'feature/**'

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g htmlhint stylelint stylelint-config-standard
      - run: echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json
      - run: htmlhint src/**/*.html
      - run: stylelint src/**/*.css

  build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dev-website-image .